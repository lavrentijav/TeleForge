name: Linux.

# Both Linux builds live here, selected by matrix.mode:
#   ci        — upstream-style smoke build: test API credentials, autoupdate and
#               crash reports on. Also covers the no-X11 variant.
#   teleforge — shippable build: real API credentials, autoupdate and crash
#               reports off.
# They share the container, so the centos_env image is built once from
# Telegram/build/docker/centos_env and reused by every leg through the buildx
# cache. That is also why this is worth merging: the standalone TeleForge
# workflow used to pull ghcr.io/telegramdesktop/tdesktop/centos_env:latest,
# which ships CMake 3.26 and cannot configure this project (it needs 3.31+).
# The Dockerfile here pins cmake==3.31.10, so building the image locally fixes
# that at the root instead of working around it.
#
# Snap packaging stays in snap.yml: snapcraft is a different toolchain
# producing a different artifact, and shares none of the steps below.

on:
  push:
    # Pushes to the canary branches run only canary.yml, see there.
    branches-ignore:
      - public-canary
      - private-canary
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      config:
        description: 'Build configuration'
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:

  linux:
    name: Rocky Linux 8 ${{ matrix.mode }} ${{ matrix.defines }}
    runs-on: ${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/nightly') && 'depot-ubuntu-latest-16' || 'ubuntu-latest' }}

    strategy:
      # One failing leg must not cancel the others: a teleforge build breaking
      # says nothing about the upstream-style ci leg, and vice versa.
      fail-fast: false
      matrix:
        include:
          - mode: ci
            defines: ""
          - mode: ci
            defines: "DESKTOP_APP_DISABLE_X11_INTEGRATION"
          - mode: teleforge
            defines: ""

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      IMAGE_TAG: tdesktop:centos_env
      BUILD_CONFIG: ${{ github.event.inputs.config || 'Release' }}

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
          | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Restore Docker cache mounts.
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Libraries.
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: ${{ env.ONLY_CACHE == 'false' }}
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      # actions/cache does not save on a failed job, so a compile failure used
      # to throw away the built image layers and the next run rebuilt the whole
      # centos_env from scratch. Saved here, before the (fallible) build.
      - name: Save libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Restore Telegram Desktop cache.
        id: cache-tdesktop
        if: env.ONLY_CACHE == 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-tdesktop-${{ matrix.defines || 'null' }}-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-tdesktop-${{ matrix.defines || 'null' }}-

      - name: Telegram Desktop build.
        if: matrix.mode == 'ci' && env.ONLY_CACHE == 'false'
        run: |
          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=TeleForge ci ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=TeleForge ci" >> $GITHUB_ENV
          fi

          ccache -z

          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
          -e CONFIG=$BUILD_CONFIG \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          $IMAGE_TAG \
          env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=$BUILD_CONFIG \
          -D CMAKE_C_FLAGS_DEBUG="-O0 -fpch-preprocess" \
          -D CMAKE_CXX_FLAGS_DEBUG="-O0 -fpch-preprocess" \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF \
          -D TDESKTOP_API_TEST=ON \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF \
          $DEFINE 2>&1 | tee build.log

      # llama.cpp is deliberately off here. The standalone script used to clone
      # it and then always disable it anyway — its check ran `-d` against a
      # CMakeLists.txt path, which is never a directory — so no CI build has
      # ever linked it. Turning it on is a separate change with its own build
      # cost, not something to switch on silently while merging workflows.
      - name: TeleForge build.
        if: matrix.mode == 'teleforge' && env.ONLY_CACHE == 'false'
        env:
          API_ID: "29721186"
          API_HASH: "196a54e79899fbf76333ded98ff5027f"
        run: |
          echo "ARTIFACT_NAME=TeleForge linux $BUILD_CONFIG" >> $GITHUB_ENV

          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -e CONFIG=$BUILD_CONFIG \
          $IMAGE_TAG \
          /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=$BUILD_CONFIG \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF \
          -D CMAKE_POLICY_DEFAULT_CMP0218=OLD \
          -D TDESKTOP_API_ID=$API_ID \
          -D TDESKTOP_API_HASH=$API_HASH \
          -D DESKTOP_APP_USE_LLAMA_CPP=OFF \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON 2>&1 | tee build.log

      # always(): warnings matter most precisely when the build failed. tee
      # above keeps the live output; pipefail (on by default for shell: bash)
      # means the pipe does not mask a non-zero build status.
      - name: Collect warnings.
        if: always() && env.ONLY_CACHE == 'false'
        run: |
          mkdir -p warnings
          cp build.log warnings/ 2>/dev/null || true
          grep -hE "warning|Warning" build.log 2>/dev/null | sort -u > warnings/warnings.txt || true
          echo "unique warning lines: $(wc -l < warnings/warnings.txt 2>/dev/null || echo 0)"
      - uses: actions/upload-artifact@v7
        name: Upload warnings.
        if: always() && env.ONLY_CACHE == 'false'
        with:
          name: warnings ${{ env.ARTIFACT_NAME }}
          path: warnings/
          retention-days: 7
          if-no-files-found: ignore

      - name: Count ccache misses.
        id: ccache-stats
        if: env.ONLY_CACHE == 'false'
        run: |
          MISSES=$(ccache --print-stats | sed -n 's/^cache_miss\t//p' | head -1)
          case "$MISSES" in (*[!0-9]*|'') MISSES=0;; esac
          echo "misses=$MISSES" >> $GITHUB_OUTPUT
          echo "ccache misses this run: $MISSES"

      - name: Trim Telegram Desktop cache.
        if: >
          env.ONLY_CACHE == 'false'
            && github.ref_name == github.event.repository.default_branch
            && fromJSON(steps.ccache-stats.outputs.misses) > 300
        run: ccache --evict-older-than 1d

      - name: Save Telegram Desktop cache.
        if: >
          env.ONLY_CACHE == 'false'
            && github.ref_name == github.event.repository.default_branch
            && fromJSON(steps.ccache-stats.outputs.misses) > 300
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-tdesktop.outputs.cache-primary-key }}

      # The binary is TeleForge, not Telegram: Telegram/CMakeLists.txt sets
      # OUTPUT_NAME to TeleForge for every non-macstore build.
      - name: Check.
        if: env.ONLY_CACHE == 'false'
        run: |
          filePath="out/$BUILD_CONFIG/TeleForge"
          if test -f "$filePath"; then
            echo "Build successfully done! :)"

            size=$(stat -c %s "$filePath")
            echo "File size of ${filePath}: ${size} Bytes."
          else
            echo "Build error, output file does not exist."
            ls -la "out/$BUILD_CONFIG" || true
            exit 1
          fi

      # Updater only exists when autoupdate is enabled, i.e. in ci mode.
      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          cd out/$BUILD_CONFIG
          mkdir artifact
          mv TeleForge artifact/
          if [ -f Updater ]; then
            mv Updater artifact/
          fi
      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/${{ env.BUILD_CONFIG }}/artifact/
          retention-days: 7
