name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  private-keys:
    name: No private key material
    runs-on: ubuntu-latest
    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The updater stub step in canary.yml embeds the PEM header as text, so
      # the workflows themselves are outside the scan.
      - name: Scan tracked files for PEM private keys.
        run: |
          set -euo pipefail
          hits=$(git grep -nIE -- '-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----' -- . \
            ':(exclude).github/**' ':(exclude)Telegram/ThirdParty/**' || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::Private key material is committed to the repository. Rotate the key, remove it from the working tree and from git history."
            exit 1
          fi
          echo "No private key material in tracked files."
