name: TeleForge Linux

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/teleforge_linux.yml'
      - 'teleforge_linux_build.sh'
      - 'Telegram/**'
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        default: both
        type: choice
        options:
          - x86_64
      config:
        description: 'Build configuration'
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: teleforge-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux ${{ matrix.arch }} ${{ github.event.inputs.config || 'Release' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # aarch64 is intentionally absent: ghcr.io/telegramdesktop/tdesktop/
        # centos_env is published as a single-arch amd64 image, so docker
        # refuses --platform linux/arm64 and QEMU cannot substitute for a
        # missing manifest.
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            out_dir: out-linux-x64
    steps:
      - name: Filter matrix by workflow input
        id: filter
        run: |
          INPUT="${{ github.event.inputs.arch || 'x86_64' }}"
          if [ "$INPUT" != "both" ] && [ "$INPUT" != "${{ matrix.arch }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone
        if: steps.filter.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare llama.cpp
        if: steps.filter.outputs.skip != 'true'
        run: |
          mkdir -p ../Libraries/win64
          if [ ! -f ../Libraries/win64/llama.cpp/CMakeLists.txt ]; then
            git clone --depth 1 https://github.com/ggml-org/llama.cpp ../Libraries/win64/llama.cpp
          fi

      - name: Pull build image
        if: steps.filter.outputs.skip != 'true'
        run: docker pull --platform ${{ matrix.platform }} ghcr.io/telegramdesktop/tdesktop/centos_env:latest

      - name: Build TeleForge
        if: steps.filter.outputs.skip != 'true'
        env:
          CONFIG: ${{ github.event.inputs.config || 'Release' }}
        run: |
          chmod +x ./teleforge_linux_build.sh
          ./teleforge_linux_build.sh "${{ matrix.arch }}" "$CONFIG"

      - name: Upload artifact
        if: steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TeleForge-linux-${{ matrix.arch }}-${{ github.event.inputs.config || 'Release' }}
          path: |
            ${{ matrix.out_dir }}/${{ github.event.inputs.config || 'Release' }}/bin/TeleForge
            ${{ matrix.out_dir }}/${{ github.event.inputs.config || 'Release' }}/TeleForge
          if-no-files-found: error
