name: Linux AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tdesktop/**'
      - '.github/workflows/linux_appimage.yml'

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libssl-dev libxcb-*-dev \
            libglib2.0-dev libgtk-3-dev \
            patchelf fuse libfuse2

      - name: Configure
        working-directory: tdesktop/Telegram
        run: |
          ./configure.sh -D DESKTOP_APP_USE_LLAMA_CPP=ON

      - name: Build
        run: cmake --build tdesktop/out --config Release --target Telegram

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: TeleForge-linux-x64
          path: tdesktop/out/Release/TeleForge
